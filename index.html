<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Skyblock Játék</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="statusPanel">
        <div class="status-item">
            <span class="icon">💰</span>
            <span id="money">0</span>
        </div>
        <div class="status-item">
            <span class="icon">🪵</span>
            <span id="planks">0</span>
        </div>
        <div class="status-item">
            <span class="icon">🌽</span>
            <span id="corn">0</span>
        </div>
    </div>

    <div id="bubble" class="hidden">
        <button class="close-btn" id="closeBubble">×</button>
        <div id="bubbleContent"></div>
    </div>

    <div id="plankModal" class="modal hidden">
        <div class="modal-content">
            <h2>Deszka Eladás</h2>
            <div class="slider-container">
                <label>Eladandó deszkák: <span id="sellAmount">0</span></span>
                <input type="range" id="plankSlider" min="1" max="1" value="1" maxlength="10">
            </div>
            <div class="modal-buttons">
                <button id="cancelSell">Mégsem</button>
                <button id="confirmSell">Eladás</button>
            </div>
        </div>
    </div>

    <div id="cornModal" class="modal hidden">
        <div class="modal-content">
            <h2>Kukorica Eladás</h2>
            <div class="slider-container">
                <label>Eladandó kukorica: <span id="cornSellAmount">0</span></span>
                <input type="range" id="cornSlider" min="1" max="1" value="1" maxlength="10">
            </div>
            <div class="modal-buttons">
                <button id="cancelCornSell">Mégsem</button>
                <button id="confirmCornSell">Eladás</button>
            </div>
        </div>
    </div>

    <div id="errorMessage" class="error-message hidden"></div>

    <div id="soundToggle" class="sound-toggle" title="Zene be/ki">
        <svg id="soundOn" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="currentColor"/>
        </svg>
        <svg id="soundOff" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" fill="currentColor"/>
        </svg>
    </div>

    <div id="version">V1.3.1</div>

    <div id="discordIcon" class="discord-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" fill="currentColor"/>
        </svg>
    </div>

    <div id="discordModal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" id="closeDiscordModal">×</button>
            <div class="discord-box">
                <a href="https://discord.gg/KrZHvfVUa" target="_blank" rel="noopener noreferrer" class="discord-url">https://discord.gg/KrZHvfVUa</a>
            </div>
        </div>
    </div>

    <div id="tutorialModal" class="modal hidden">
        <div class="modal-content tutorial-modal">
            <h2 id="tutorialTitle">Üdvözöllek!</h2>
            <div id="tutorialContent" class="tutorial-content"></div>
            <div id="tutorialStepIndicator" class="tutorial-step-indicator">1 / 7</div>
            <div class="modal-buttons tutorial-buttons">
                <button id="tutorialSkip" class="tutorial-skip">Kihagyás</button>
                <div class="tutorial-nav">
                    <button id="tutorialPrev">Előző</button>
                    <button id="tutorialNext">Következő</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
