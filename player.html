<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Játékosok - Retro Skyblock</title>
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <style>
        /* === THEME VÁLTOZÓK === */
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-tertiary: #0f3460;
            --bg-card: rgba(0, 0, 0, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #888888;
            --text-dark-muted: #666666;
            --border-color: #4a4a4a;
            --accent-gold: #ffd700;
            --accent-blue: #4a9eff;
            --accent-red: #ff6b6b;
        }
        [data-theme="light"] {
            --bg-primary: #f0f4f8;
            --bg-secondary: #e2e8f0;
            --bg-tertiary: #cbd5e1;
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a2e;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --text-dark-muted: #a0aec0;
            --border-color: #cbd5e1;
            --accent-gold: #d69e2e;
            --accent-blue: #3182ce;
            --accent-red: #e53e3e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: var(--text-primary);
            padding: 40px 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--accent-gold);
            font-size: 36px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .back-link {
            display: inline-block;
            color: var(--accent-blue);
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .back-link:hover {
            color: #6ab4ff;
            text-decoration: underline;
        }
        .player-count {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 14px;
        }
        .player-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .player-card {
            background: var(--bg-card);
            border: 3px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        .player-rank {
            font-size: 24px;
            min-width: 40px;
            text-align: center;
            color: var(--text-muted);
        }
        .player-rank.first {
            color: var(--accent-gold);
        }
        .player-rank.second {
            color: #c0c0c0;
        }
        .player-rank.third {
            color: #cd7f32;
        }
        .player-info {
            flex: 1;
        }
        .player-name {
            font-size: 18px;
            color: var(--text-primary);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .player-badge {
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 0;
            font-weight: normal;
        }
        .player-badge.admin {
            background: rgba(255, 107, 107, 0.3);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
        }
        .player-badge.player {
            background: rgba(74, 158, 255, 0.3);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
        }
        .player-date {
            font-size: 12px;
            color: var(--text-dark-muted);
            margin-top: 5px;
        }
        .no-players {
            text-align: center;
            color: var(--text-dark-muted);
            padding: 40px;
            font-size: 16px;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }
            .player-name {
                font-size: 16px;
            }
        }
    </style>
    <script>
        // Téma inicializálása localStorage-ból
        (function() {
            const savedTheme = localStorage.getItem('retroSkyblockTheme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Vissza a játékhoz</a>
        <h1>👥 Játékosok</h1>
        <div id="playerCount" class="player-count">Betöltés...</div>
        <div id="playerList" class="player-list"></div>
    </div>

    <script>
        // =====================================================
        // JÁTÉKOSOK LISTÁJA - IDE ADD HOZZÁ AZ ÚJ JÁTÉKOSOKAT!
        // =====================================================
        const PLAYERS = [
            { username: 'Szíriusz', role: 'admin', joinDate: '2025-12-15' }
            // Új játékos hozzáadása:
            // { username: 'JátékosNeve', role: 'player', joinDate: '2025-12-26' },
        ];
        // =====================================================
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getFullYear()}.${(date.getMonth()+1).toString().padStart(2,'0')}.${date.getDate().toString().padStart(2,'0')}`;
        }
        
        function loadPlayers() {
            const playerList = document.getElementById('playerList');
            const playerCount = document.getElementById('playerCount');
            
            if (PLAYERS.length === 0) {
                playerList.innerHTML = '<div class="no-players">Még nincsenek regisztrált játékosok.</div>';
                playerCount.textContent = '0 játékos';
                return;
            }
            
            playerCount.textContent = `${PLAYERS.length} regisztrált játékos`;
            
            playerList.innerHTML = PLAYERS.map((user, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'first';
                else if (rank === 2) rankClass = 'second';
                else if (rank === 3) rankClass = 'third';
                
                const isAdmin = user.role === 'admin';
                const badgeClass = isAdmin ? 'admin' : 'player';
                const badgeText = isAdmin ? '👑 Admin' : '👤 Játékos';
                
                return `
                    <div class="player-card">
                        <div class="player-rank ${rankClass}">#${rank}</div>
                        <div class="player-info">
                            <div class="player-name">
                                ${escapeHtml(user.username)}
                                <span class="player-badge ${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="player-date">📅 Csatlakozott: ${formatDate(user.joinDate)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Oldal betöltésekor
        loadPlayers();
    </script>
</body>
</html>
